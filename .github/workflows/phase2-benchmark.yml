name: NeuralMesh Phase 2.1 - Held-out Plasticity Benchmark

on:
  push:
    branches: [phase/2.1-multiscenario-plasticity]
    paths:
      - .github/workflows/phase2-benchmark.yml
  pull_request:
    paths:
      - neural_mesh/**
      - tests/**
      - .github/workflows/phase2-benchmark.yml
  workflow_dispatch:
    inputs:
      seed:
        description: Deterministic synthetic dataset seed
        type: string
        required: false
        default: '314159'

permissions:
  contents: read

concurrency:
  group: phase21-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Full unit test discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Execute actual phase 1 and phase 2.1 tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  prepare:
    if: github.event_name != 'pull_request'
    needs: [tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare 512 training, 128 validation and 256 held-out test scenarios
        env:
          SEED: ${{ inputs.seed || '314159' }}
        run: |
          python -m neural_mesh.phase2 prepare --seed "$SEED" \
            --train-count 512 --validation-count 128 --test-count 256 \
            --out fixture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase21-public-${{ github.run_id }}
          path: |
            fixture/public.json
            fixture/weights.json
            fixture/manifest.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase21-trainval-targets-${{ github.run_id }}
          path: fixture/trainval-labels.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase21-test-targets-${{ github.run_id }}
          path: fixture/test-labels.json
          retention-days: 14
          if-no-files-found: error

  round-1:
    needs: [prepare]
    name: "Phase 2.1 observe / ${{ matrix.node }}"
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        node: [position, velocity, acceleration, short_horizon, long_horizon, stabilizer]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phase21-public-${{ github.run_id }}
          path: fixture
      - name: Infer specialist predictions without any labels
        env:
          NODE: ${{ matrix.node }}
        run: |
          mkdir -p receipts
          python -m neural_mesh.phase2 infer --node "$NODE" \
            --public fixture/public.json --weights fixture/weights.json \
            --out "receipts/node-$NODE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase21-r1-${{ matrix.node }}-${{ github.run_id }}
          path: receipts/
          retention-days: 14
          if-no-files-found: error

  train-synapses:
    needs: [round-1]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phase21-public-${{ github.run_id }}
          path: fixture
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phase21-trainval-targets-${{ github.run_id }}
          path: train-only
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: phase21-r1-*-${{ github.run_id }}
          path: receipts
          merge-multiple: true
      - name: Fit connections on train and select on validation (never test)
        run: |
          python -m neural_mesh.phase2 train \
            --public fixture/public.json --weights fixture/weights.json \
            --receipts receipts --trainval train-only/trainval-labels.json \
            --out trained
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase21-frozen-router-${{ github.run_id }}
          path: trained/
          retention-days: 30
          if-no-files-found: error

  round-2:
    needs: [train-synapses]
    name: "Phase 2.1 feedback / ${{ matrix.node }}"
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        node: [position, velocity, acceleration, short_horizon, long_horizon, stabilizer]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phase21-frozen-router-${{ github.run_id }}
          path: trained
      - name: Recurrent peer updates with learned, frozen routing
        env:
          NODE: ${{ matrix.node }}
        run: |
          mkdir -p refined
          python -m neural_mesh.phase2 refine --node "$NODE" \
            --round1 trained/round1.json --router trained/router.json \
            --out "refined/node-$NODE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase21-r2-${{ matrix.node }}-${{ github.run_id }}
          path: refined/
          retention-days: 14
          if-no-files-found: error

  evaluate:
    needs: [round-2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phase21-public-${{ github.run_id }}
          path: fixture
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phase21-test-targets-${{ github.run_id }}
          path: sealed-test
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phase21-frozen-router-${{ github.run_id }}
          path: trained
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: phase21-r2-*-${{ github.run_id }}
          path: refined
          merge-multiple: true
      - name: Quantify held-out results with paired uncertainty bounds
        run: |
          mkdir -p evidence
          python -m neural_mesh.phase2 evaluate \
            --round1 trained/round1.json --router trained/router.json \
            --weights fixture/weights.json --refined refined \
            --test-labels sealed-test/test-labels.json --out evidence
          cp trained/router.json evidence/frozen-router.json
          cp fixture/manifest.json evidence/manifest.json
          {
            echo "### Phase 2.1 - independent test results"
            echo "512 train / 128 validation / 256 test across four synthetic regimes."
            echo "Read the published metrics.json; completed jobs are not evidence of accuracy improvement."
            echo "Training workers never downloaded test targets."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase21-evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
