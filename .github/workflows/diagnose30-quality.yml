name: NeuralMesh - Learning Acceptance and Observability Diagnostic

on:
  push:
    branches: [fix/2.6.2-observed-competence-tree]
    paths: [.github/workflows/diagnose30-quality.yml]
  pull_request:
    paths:
      - neural_mesh/diagnose30.py
      - neural_mesh/research_gate.py
      - tests/test_diagnose30.py
      - .github/workflows/diagnose30-quality.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnose30-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Test diagnostic integrity and separate scientific acceptance
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m neural_mesh.diagnose30 --help
          python -m neural_mesh.research_gate --help

  observability:
    if: github.event_name != 'pull_request'
    needs: [tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Retrieve the original protected neural parent and physics adapter
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: transfer26-frozen-adapter-44873535607
          run-id: 44873535607
          github-token: ${{ github.token }}
          path: frozen
      - name: Generate calibration-only samples; remove unused test targets
        run: |
          python -m neural_mesh.phase2 prepare --seed 30211 \
            --train-count 512 --validation-count 128 --test-count 8 --out id
          rm -f id/test-labels.json
          python -m neural_mesh.transfer26 subset --seed 50211 --count 256 \
            --regimes bounce,swirl --out known-train
          python -m neural_mesh.transfer26 subset --seed 50212 --count 128 \
            --regimes bounce,swirl --out known-val
      - name: Quantify training-to-validation trust stability and motion-type separability
        run: |
          mkdir -p diagnostic
          python -m neural_mesh.diagnose30 \
            --parent frozen/parent.json --adapter frozen/adapter.json \
            --id-public id/public.json --id-labels id/trainval-labels.json \
            --novel-train-public known-train/public.json \
            --novel-train-targets known-train/targets.json \
            --novel-val-public known-val/public.json \
            --novel-val-targets known-val/targets.json \
            --out diagnostic/observability.json
          {
            echo "### Observable-physics separability diagnostic"
            echo "Only calibration and validation labels accessed; NO sealed test labels."
            echo "Oracle class labels are diagnostic-only and NEVER available at inference."
            echo "Scientific acceptance for the actual candidate is checked separately."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: observability-diagnostic-${{ github.run_id }}
          path: diagnostic/
          retention-days: 30
          if-no-files-found: error

  acceptance:
    if: github.event_name != 'pull_request'
    needs: [observability]
    name: Scientific acceptance (fails when model is rejected)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Retrieve the actual Phase 2.6.3 frozen benchmark evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: c29-evidence-44875197447
          run-id: 44875197447
          github-token: ${{ github.token }}
          path: scored
      - name: Require real old-skill retention and cross-family transfer
        run: |
          python -m neural_mesh.research_gate \
            --report scored/evaluation.json --gate scored/promotion-gate.json
          echo "Acceptance passed; still requires human review."
